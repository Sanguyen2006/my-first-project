<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Tài khoản | May Store
  </title>
  <link href="assets/css/style.css" rel="stylesheet"/>
  <link href="assets/css/pages.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="simple-head">
   <a class="brand" href="index.html">
    <b class="brand-mark">
     M
    </b>
    <span>
     MAY
     <span class="light">
      STORE
     </span>
     <small>
      CÔNG NGHỆ CHO CUỘC SỐNG
     </small>
    </span>
   </a>
   <a href="index.html">
    ← Quay về cửa hàng
   </a>
  </header>
  <main class="page-wrap">
   <p class="eyebrow">
    TÀI KHOẢN / THÔNG TIN CÁ NHÂN
   </p>
   <h1 class="page-title">
    Thông tin tài khoản
    <span>
     .
    </span>
   </h1>
   <form class="form-panel profile-panel" id="profile-form">
    <div class="form-two">
     <label>
      Họ và tên
      <input name="ho_ten" placeholder="Họ và tên" required=""/>
     </label>
     <label>
      Email
      <input name="email" placeholder="Email" required="" type="email"/>
     </label>
    </div>
    <div class="form-two">
     <label>
      Số điện thoại
      <input name="so_dien_thoai" placeholder="Số điện thoại"/>
     </label>
     <label>
      Ngày sinh
      <input name="ngay_sinh" type="date"/>
     </label>
    </div>
    <label>
     Giới tính
     <select name="gioi_tinh">
      <option value="">
       Chọn giới tính
      </option>
      <option>
       Nam
      </option>
      <option>
       Nữ
      </option>
      <option>
       Khác
      </option>
     </select>
    </label>
    <button class="btn dark">
     LƯU THÔNG TIN　→
    </button>
    <p class="form-message" id="form-message">
    </p>
   </form>
  </main>
  <script src="assets/js/pages.js">
  </script>
 </body>
</html>
