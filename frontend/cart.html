<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Giỏ hàng | May Store
  </title>
  <link href="assets/css/style.css" rel="stylesheet"/>
  <link href="assets/css/pages.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="simple-head">
   <a class="brand" href="index.html">
    <b class="brand-mark">
     M
    </b>
    <span>
     MAY
     <span class="light">
      STORE
     </span>
     <small>
      CÔNG NGHỆ CHO CUỘC SỐNG
     </small>
    </span>
   </a>
   <a href="index.html">
    ← Tiếp tục mua hàng
   </a>
  </header>
  <main class="page-wrap">
   <p class="eyebrow">
    MAY STORE / GIỎ HÀNG
   </p>
   <h1 class="page-title">
    Giỏ hàng của bạn
    <span>
     .
    </span>
   </h1>
   <div class="cart-layout">
    <section class="cart-table" id="cart-table">
    </section>
    <aside class="summary-panel">
     <h2>
      Tóm tắt đơn hàng
     </h2>
     <div class="summary-row">
      <span>
       Tổng tiền hàng
      </span>
      <b id="cart-subtotal">
       0 ₫
      </b>
     </div>
     <div class="summary-row">
      <span>
       Phí vận chuyển
      </span>
      <b>
       Miễn phí
      </b>
     </div>
     <div class="summary-row total">
      <span>
       Tổng thanh toán
      </span>
      <b id="cart-total">
       0 ₫
      </b>
     </div>
     <button class="btn dark full" id="checkout-btn">
      TIẾN HÀNH THANH TOÁN　→
     </button>
     <p class="summary-note">
      Đây là phiên bản demo. Vui lòng đăng nhập để tiếp tục.
     </p>
    </aside>
   </div>
  </main>
  <script src="assets/js/pages.js">
  </script>
 </body>
</html>
